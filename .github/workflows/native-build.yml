name: Native build
on:
  workflow_call:
    inputs:
      package:
        type: boolean
        default: false
      release_tag:
        type: string
        default: ''
# Inherit read-only CI permissions or release-only contents:write from the caller.
jobs:
  native:
    # Standard hosted runners are free only while the repository is public.
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.0'
      - name: Install Python dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Prepare verified tools and sources
        run: python scripts/prepare_tools.py
      - name: Windows native compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: make diffutils mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf
      - name: Compile FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build_ffmpeg.sh
      - name: Test and lint
        run: |
          python -m pytest
          python -m ruff check .
          tools/node.exe --check web/app.js
      - name: Build native executable
        run: python scripts/build.py
      - name: Smoke-test native executable
        run: python scripts/smoke_release.py
      - name: Collect corresponding sources and package
        if: inputs.package
        run: |
          python scripts/collect_sources.py
          python scripts/package_release.py
      - name: Upload directly to draft release (no Actions artifact storage)
        if: inputs.package && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
