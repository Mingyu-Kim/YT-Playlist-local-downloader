name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event.repository.private == false && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare draft for direct uploads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "YT-PL-Downloader $RELEASE_TAG" --notes "Native builds pending. Do not publish until all three platforms pass."
          fi
  build:
    needs: prepare
    if: always() && github.event.repository.private == false && (needs.prepare.result == 'success' || (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')))
    permissions:
      contents: write
    uses: ./.github/workflows/native-build.yml
    with:
      package: true
      release_tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
  draft:
    if: github.event.repository.private == false && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify complete release assets and update draft notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > assets.txt
          for target in windows-x64 macos-arm64 macos-x64; do
            for suffix in .zip -sources.zip .sha256; do
              grep -Fx "YT-PL-Downloader-${RELEASE_TAG#v}-$target$suffix" assets.txt
            done
          done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file CHANGELOG.md
