[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["licenses", "build", "dist", ".vendor", ".build-tools"]

[tool.ruff.lint]
# Begin with correctness checks; dense legacy formatting is documented technical debt.
select = ["E9", "F63", "F7", "F82"]
